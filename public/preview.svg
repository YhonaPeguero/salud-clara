<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1703 901" role="img" aria-labelledby="title desc">
  <title id="title">Preview de K-milla</title>
  <desc id="desc">Pantalla principal de K-milla con buscador de hospitales, estadisticas nacionales y asistente holografico.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2633"/>
      <stop offset="0.35" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.52" stop-color="#9ca35e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.77 0 0 0 0 0.37 0 0 0 .8 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="6" height="8" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="#dcfce7" opacity="0.38"/>
    </pattern>
  </defs>

  <rect width="1703" height="901" fill="#f8fafc"/>
  <rect width="1703" height="591" fill="url(#hero)"/>
  <circle cx="-45" cy="132" r="178" fill="#14b8a6" opacity="0.14"/>
  <circle cx="1668" cy="590" r="250" fill="#f97316" opacity="0.13"/>
  <rect y="590" width="1703" height="72" fill="url(#hero)" opacity="0.9"/>
  <rect y="590" width="1703" height="90" fill="#f8fafc" opacity="0.9" filter="url(#softGlow)"/>

  <g transform="translate(412 25)">
    <path d="M17 29c-1-.5-13-7-16-16A9 9 0 0 1 17 5.7 9 9 0 0 1 33 13C30 22 18 28.5 17 29Z" fill="#22c55e"/>
    <path d="M5.5 15.5h5l2-4 3 9 2.5-6 2 3h9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="25" fill="#fff" font-family="Georgia, serif" font-size="28" font-weight="700">K-milla</text>
  </g>
  <g transform="translate(1035 33)">
    <circle cx="6" cy="5" r="5" fill="#10b981"/>
    <text x="18" y="9" fill="#2dd4bf" font-family="Arial, sans-serif" font-size="12" font-weight="700">Datos oficiales</text>
  </g>

  <text x="852" y="113" text-anchor="middle" fill="#14b8a6" font-family="Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="5">DIPRES + MINSAL - DATOS OFICIALES</text>
  <text x="852" y="179" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="800">Tu hospital, <tspan fill="url(#titleGradient)">en numeros</tspan></text>
  <text x="852" y="232" text-anchor="middle" fill="url(#titleGradient)" font-family="Arial, sans-serif" font-size="48" font-weight="800">publicos.</text>
  <text x="852" y="282" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16" font-weight="700">Presupuesto recibido y personas en espera de tu Servicio de</text>
  <text x="852" y="308" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16" font-weight="700">Salud. Una sola busqueda.</text>

  <g transform="translate(412 348)">
    <rect width="720" height="58" rx="16" fill="#fff"/>
    <path d="M27 24a7 7 0 1 0 5 12l7 7" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <text x="43" y="35" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Escribe tu hospital, comuna o ciudad...</text>
    <rect x="625" y="10" width="85" height="40" rx="12" fill="#99d4cf"/>
    <text x="667" y="36" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Buscar</text>
  </g>
  <g transform="translate(662 420)" fill="none" font-family="Arial, sans-serif" font-size="10">
    <text x="-28" y="15" fill="#94a3b8">Probar:</text>
    <rect x="18" y="0" width="72" height="25" rx="13" stroke="#cbd5e1"/>
    <text x="54" y="16" text-anchor="middle" fill="#cbd5e1">San Jose</text>
    <rect x="98" y="0" width="66" height="25" rx="13" stroke="#cbd5e1"/>
    <text x="131" y="16" text-anchor="middle" fill="#cbd5e1">Temuco</text>
    <rect x="172" y="0" width="84" height="25" rx="13" stroke="#cbd5e1"/>
    <text x="214" y="16" text-anchor="middle" fill="#cbd5e1">Puente Alto</text>
  </g>

  <g transform="translate(412 476)">
    <rect width="720" height="104" rx="16" fill="#0f172a" stroke="#cbd5e1"/>
    <path d="M180 0v104M360 0v104M540 0v104" stroke="#334155"/>
    <g font-family="Arial, sans-serif" font-weight="800">
      <text x="18" y="28" fill="#94a3b8" font-size="10" letter-spacing="2">PRESUPUESTO</text>
      <text x="18" y="62" fill="#fff" font-size="27">$12,5 B</text>
      <text x="18" y="84" fill="#64748b" font-size="10">Cuarto trimestre 2024</text>
      <text x="198" y="28" fill="#94a3b8" font-size="10" letter-spacing="2">EJECUTADO</text>
      <text x="198" y="62" fill="#fff" font-size="27">99.2%</text>
      <text x="198" y="84" fill="#64748b" font-size="10">del presupuesto</text>
      <text x="378" y="28" fill="#94a3b8" font-size="10" letter-spacing="2">ESPERAN CIRUGIA</text>
      <text x="378" y="62" fill="#f97316" font-size="27">345.785</text>
      <text x="378" y="84" fill="#64748b" font-size="10">JUNIO 2025</text>
      <text x="558" y="28" fill="#94a3b8" font-size="10" letter-spacing="2">ESPERAN CONSULTA</text>
      <text x="558" y="62" fill="#f97316" font-size="27">2.164.182</text>
      <text x="558" y="84" fill="#64748b" font-size="10">JUNIO 2025</text>
    </g>
  </g>

  <g transform="translate(412 694)">
    <line x1="0" y1="0" x2="276" y2="0" stroke="#dbe4ef"/>
    <line x1="444" y1="0" x2="720" y2="0" stroke="#dbe4ef"/>
    <text x="360" y="4" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2">EJEMPLOS EN VIVO</text>
    <rect y="38" width="720" height="170" rx="24" fill="#fff" filter="url(#softGlow)" opacity="0.18"/>
    <rect y="38" width="720" height="170" rx="24" fill="#fff"/>
    <rect y="38" width="720" height="124" rx="24" fill="#0f172a"/>
    <text x="26" y="76" fill="#14b8a6" font-family="Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="2">HOSPITAL</text>
    <text x="26" y="110" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="800">Hospital San Jose</text>
    <text x="26" y="138" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" font-weight="700">Region Metropolitana</text>
    <rect x="625" y="60" width="70" height="23" rx="12" fill="#0d9488"/>
    <text x="660" y="76" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="800">EJEMPLO</text>
  </g>

  <g transform="translate(1486 568)" filter="url(#softGlow)">
    <ellipse cx="92" cy="32" rx="66" ry="22" fill="#22c55e" opacity="0.35"/>
    <path d="M52 180v-72c0-29 20-54 48-60h4c28 6 48 31 48 60v72Z" fill="url(#holo)"/>
    <path d="M43 166c-29 17-44 44-44 91h204c0-47-15-74-44-91-22 24-92 24-116 0Z" fill="url(#holo)"/>
    <path d="M73 136h56l-16 68-12-20-12 20Z" fill="#0f172a" opacity="0.75"/>
    <rect x="45" y="0" width="108" height="170" rx="54" fill="url(#scan)" opacity="0.9"/>
    <rect x="40" y="260" width="108" height="34" rx="17" fill="#082f2a"/>
    <text x="94" y="282" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="3">ASISTENTE</text>
  </g>
</svg>
